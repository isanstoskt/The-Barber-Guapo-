<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Recuperar senha - Guapo The Barber
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <style>
    .recuperacao-etapa[hidden] {
      display: none !important;
    }

    .codigo-recuperacao {
      text-align: center;
      font-size: 24px;
      letter-spacing: 10px;
      font-weight: bold;
    }

    .recuperacao-email {
      margin: 0 0 20px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      text-align: center;
      overflow-wrap: anywhere;
    }

    .recuperacao-voltar {
      border: 0;
      background: transparent;
      color: #d4af37;
      cursor: pointer;
      text-decoration: underline;
      font: inherit;
    }

    /* =========================
       CAMPO DE SENHA
    ========================= */

    .campo-senha {
      position: relative;
      width: 100%;
    }

    .campo-senha input {
      width: 100%;
      padding-right: 95px;
      box-sizing: border-box;
    }

    .btn-mostrar-senha {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);

      border: 0;
      background: transparent;
      color: #d4af37;

      font-size: 13px;
      font-weight: 700;
      cursor: pointer;

      padding: 6px;
    }

    .btn-mostrar-senha:hover {
      color: #ffffff;
    }

    .btn-mostrar-senha:focus {
      outline: 2px solid #d4af37;
      outline-offset: 2px;
      border-radius: 6px;
    }
  </style>
</head>

<body class="admin-body">

  <main class="login-admin-container">
    <section class="login-admin-card">

      <div class="login-admin-logo">
        <h1>Guapo</h1>
        <span>The Barber</span>
      </div>

      <p class="admin-tag">
        Recuperar acesso
      </p>

      <h2 id="tituloRecuperacao">
        Esqueci minha senha
      </h2>

      <p
        id="textoRecuperacao"
        class="login-admin-texto"
      >
        Informe seu e-mail para receber
        um código de recuperação.
      </p>

      <!-- =========================
           ETAPA 1: INFORMAR E-MAIL
      ========================== -->

      <form
        id="formSolicitarCodigo"
        class="login-admin-form recuperacao-etapa"
      >
        <label for="email">
          E-mail cadastrado
        </label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        />

        <button
          type="submit"
          id="btnEnviarCodigo"
        >
          Enviar código
        </button>
      </form>

      <!-- =========================
           ETAPA 2: CONFIRMAR CÓDIGO
      ========================== -->

      <form
        id="formVerificarCodigo"
        class="login-admin-form recuperacao-etapa"
        hidden
      >
        <p
          id="emailEnviado"
          class="recuperacao-email"
        ></p>

        <label for="codigo">
          Código de 6 números
        </label>

        <input
          type="text"
          id="codigo"
          class="codigo-recuperacao"
          placeholder="000000"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          required
        />

        <button
          type="submit"
          id="btnVerificarCodigo"
        >
          Confirmar código
        </button>

        <button
          type="button"
          id="btnReenviarCodigo"
          class="recuperacao-voltar"
        >
          Reenviar código
        </button>

        <button
          type="button"
          id="btnTrocarEmail"
          class="recuperacao-voltar"
        >
          Usar outro e-mail
        </button>
      </form>

      <!-- =========================
           ETAPA 3: NOVA SENHA
      ========================== -->

      <form
        id="formRedefinirSenha"
        class="login-admin-form recuperacao-etapa"
        hidden
      >
        <label for="novaSenha">
          Nova senha
        </label>

        <div class="campo-senha">
          <input
            type="password"
            id="novaSenha"
            placeholder="Mínimo de 6 caracteres"
            minlength="6"
            autocomplete="new-password"
            required
          />

          <button
            type="button"
            class="btn-mostrar-senha"
            data-campo="novaSenha"
            aria-label="Mostrar nova senha"
            aria-pressed="false"
          >
            Mostrar
          </button>
        </div>

        <label for="confirmarSenha">
          Confirmar nova senha
        </label>

        <div class="campo-senha">
          <input
            type="password"
            id="confirmarSenha"
            placeholder="Digite novamente"
            minlength="6"
            autocomplete="new-password"
            required
          />

          <button
            type="button"
            class="btn-mostrar-senha"
            data-campo="confirmarSenha"
            aria-label="Mostrar confirmação da senha"
            aria-pressed="false"
          >
            Mostrar
          </button>
        </div>

        <button
          type="submit"
          id="btnRedefinirSenha"
        >
          Redefinir senha
        </button>
      </form>

      <p
        id="mensagemRecuperar"
        class="mensagem-login"
      ></p>

      <div class="login-links">
        <a
          href="login.html"
          class="login-voltar destaque-link"
        >
          Voltar para o login
        </a>

        <a
          href="index.html"
          class="login-voltar"
        >
          Voltar para o site
        </a>
      </div>

    </section>
  </main>

  <script src="auth.js?v=24"></script>

  <script>
    const tituloRecuperacao =
      document.getElementById(
        "tituloRecuperacao"
      );

    const textoRecuperacao =
      document.getElementById(
        "textoRecuperacao"
      );

    const formSolicitarCodigo =
      document.getElementById(
        "formSolicitarCodigo"
      );

    const formVerificarCodigo =
      document.getElementById(
        "formVerificarCodigo"
      );

    const formRedefinirSenha =
      document.getElementById(
        "formRedefinirSenha"
      );

    const campoEmail =
      document.getElementById(
        "email"
      );

    const emailEnviado =
      document.getElementById(
        "emailEnviado"
      );

    const campoCodigo =
      document.getElementById(
        "codigo"
      );

    const campoNovaSenha =
      document.getElementById(
        "novaSenha"
      );

    const campoConfirmarSenha =
      document.getElementById(
        "confirmarSenha"
      );

    const mensagemRecuperar =
      document.getElementById(
        "mensagemRecuperar"
      );

    const btnEnviarCodigo =
      document.getElementById(
        "btnEnviarCodigo"
      );

    const btnVerificarCodigo =
      document.getElementById(
        "btnVerificarCodigo"
      );

    const btnReenviarCodigo =
      document.getElementById(
        "btnReenviarCodigo"
      );

    const btnTrocarEmail =
      document.getElementById(
        "btnTrocarEmail"
      );

    const btnRedefinirSenha =
      document.getElementById(
        "btnRedefinirSenha"
      );

    let emailRecuperacao = "";
    let codigoConfirmado = "";

    // =========================
    // MENSAGENS
    // =========================

    function mostrarMensagem(
      texto,
      erro = false
    ) {
      mensagemRecuperar.textContent =
        texto;

      mensagemRecuperar
        .classList
        .toggle(
          "erro",
          erro
        );
    }

    // =========================
    // MOSTRAR E OCULTAR SENHA
    // =========================

    document
      .querySelectorAll(
        ".btn-mostrar-senha"
      )
      .forEach(function (botao) {
        botao.addEventListener(
          "click",
          function () {
            const campoId =
              botao.dataset.campo;

            const campoSenha =
              document.getElementById(
                campoId
              );

            if (!campoSenha) {
              return;
            }

            const senhaEstaVisivel =
              campoSenha.type === "text";

            if (senhaEstaVisivel) {
              campoSenha.type =
                "password";

              botao.textContent =
                "Mostrar";

              botao.setAttribute(
                "aria-pressed",
                "false"
              );

              botao.setAttribute(
                "aria-label",
                "Mostrar senha"
              );

            } else {
              campoSenha.type =
                "text";

              botao.textContent =
                "Ocultar";

              botao.setAttribute(
                "aria-pressed",
                "true"
              );

              botao.setAttribute(
                "aria-label",
                "Ocultar senha"
              );
            }
          }
        );
      });

    // =========================
    // CONTROLE DAS ETAPAS
    // =========================

    function esconderEtapas() {
      formSolicitarCodigo.hidden =
        true;

      formVerificarCodigo.hidden =
        true;

      formRedefinirSenha.hidden =
        true;
    }

    function mostrarEtapaEmail() {
      esconderEtapas();

      formSolicitarCodigo.hidden =
        false;

      tituloRecuperacao.textContent =
        "Esqueci minha senha";

      textoRecuperacao.textContent =
        "Informe seu e-mail para receber um código de recuperação.";

      mostrarMensagem("");

      campoEmail.readOnly =
        false;

      campoEmail.focus();
    }

    function mostrarEtapaCodigo() {
      esconderEtapas();

      formVerificarCodigo.hidden =
        false;

      tituloRecuperacao.textContent =
        "Digite o código";

      textoRecuperacao.textContent =
        "Enviamos um código de 6 números para o e-mail abaixo.";

      emailEnviado.textContent =
        emailRecuperacao;

      mostrarMensagem(
        "Verifique também a pasta de spam."
      );

      campoCodigo.value = "";

      campoCodigo.focus();
    }

    function mostrarEtapaNovaSenha() {
      esconderEtapas();

      formRedefinirSenha.hidden =
        false;

      tituloRecuperacao.textContent =
        "Crie uma nova senha";

      textoRecuperacao.textContent =
        "Código confirmado. Agora escolha sua nova senha.";

      mostrarMensagem(
        "Código confirmado com sucesso!"
      );

      campoNovaSenha.type =
        "password";

      campoConfirmarSenha.type =
        "password";

      document
        .querySelectorAll(
          ".btn-mostrar-senha"
        )
        .forEach(function (botao) {
          botao.textContent =
            "Mostrar";

          botao.setAttribute(
            "aria-pressed",
            "false"
          );
        });

      campoNovaSenha.focus();
    }

    // =========================
    // CAMPO DO CÓDIGO
    // =========================

    campoCodigo.addEventListener(
      "input",
      function () {
        campoCodigo.value =
          campoCodigo.value
            .replace(/\D/g, "")
            .slice(0, 6);
      }
    );

    // =========================
    // ENVIAR CÓDIGO
    // =========================

    formSolicitarCodigo.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        emailRecuperacao =
          campoEmail.value
            .trim()
            .toLowerCase();

        btnEnviarCodigo.disabled =
          true;

        btnEnviarCodigo.textContent =
          "Enviando...";

        mostrarMensagem(
          "Enviando código..."
        );

        const retorno =
          await solicitarCodigoRecuperacao(
            emailRecuperacao
          );

        btnEnviarCodigo.disabled =
          false;

        btnEnviarCodigo.textContent =
          "Enviar código";

        if (!retorno.sucesso) {
          mostrarMensagem(
            retorno.mensagem,
            true
          );

          return;
        }

        mostrarEtapaCodigo();
      }
    );

    // =========================
    // CONFIRMAR CÓDIGO
    // =========================

    formVerificarCodigo.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        const codigo =
          campoCodigo.value.trim();

        if (!/^\d{6}$/.test(codigo)) {
          mostrarMensagem(
            "Digite o código completo de 6 números.",
            true
          );

          return;
        }

        btnVerificarCodigo.disabled =
          true;

        btnVerificarCodigo.textContent =
          "Confirmando...";

        mostrarMensagem(
          "Verificando código..."
        );

        const retorno =
          await verificarCodigoRecuperacao(
            emailRecuperacao,
            codigo
          );

        btnVerificarCodigo.disabled =
          false;

        btnVerificarCodigo.textContent =
          "Confirmar código";

        if (!retorno.sucesso) {
          mostrarMensagem(
            retorno.mensagem,
            true
          );

          return;
        }

        codigoConfirmado =
          codigo;

        mostrarEtapaNovaSenha();
      }
    );

    // =========================
    // REENVIAR CÓDIGO
    // =========================

    btnReenviarCodigo.addEventListener(
      "click",
      async function () {
        btnReenviarCodigo.disabled =
          true;

        btnReenviarCodigo.textContent =
          "Reenviando...";

        mostrarMensagem(
          "Enviando um novo código..."
        );

        const retorno =
          await solicitarCodigoRecuperacao(
            emailRecuperacao
          );

        btnReenviarCodigo.disabled =
          false;

        btnReenviarCodigo.textContent =
          "Reenviar código";

        if (!retorno.sucesso) {
          mostrarMensagem(
            retorno.mensagem,
            true
          );

          return;
        }

        campoCodigo.value = "";

        mostrarMensagem(
          "Novo código enviado. Verifique seu e-mail."
        );

        campoCodigo.focus();
      }
    );

    // =========================
    // TROCAR E-MAIL
    // =========================

    btnTrocarEmail.addEventListener(
      "click",
      function () {
        emailRecuperacao = "";
        codigoConfirmado = "";

        campoEmail.value = "";
        campoCodigo.value = "";
        campoNovaSenha.value = "";
        campoConfirmarSenha.value = "";

        mostrarEtapaEmail();
      }
    );

    // =========================
    // REDEFINIR SENHA
    // =========================

    formRedefinirSenha.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        const novaSenha =
          campoNovaSenha.value;

        const confirmarSenha =
          campoConfirmarSenha.value;

        if (novaSenha.length < 6) {
          mostrarMensagem(
            "A senha precisa ter pelo menos 6 caracteres.",
            true
          );

          return;
        }

        if (
          novaSenha !==
          confirmarSenha
        ) {
          mostrarMensagem(
            "As senhas não conferem.",
            true
          );

          return;
        }

        btnRedefinirSenha.disabled =
          true;

        btnRedefinirSenha.textContent =
          "Redefinindo...";

        mostrarMensagem(
          "Salvando sua nova senha..."
        );

        const retorno =
          await redefinirSenha(
            emailRecuperacao,
            codigoConfirmado,
            novaSenha
          );

        if (!retorno.sucesso) {
          btnRedefinirSenha.disabled =
            false;

          btnRedefinirSenha.textContent =
            "Redefinir senha";

          mostrarMensagem(
            retorno.mensagem,
            true
          );

          return;
        }

        tituloRecuperacao.textContent =
          "Senha alterada!";

        textoRecuperacao.textContent =
          "Sua nova senha foi cadastrada com sucesso.";

        formRedefinirSenha.hidden =
          true;

        mostrarMensagem(
          "Redirecionando para o login..."
        );

        setTimeout(function () {
          window.location.replace(
            "login.html"
          );
        }, 1800);
      }
    );
  </script>

</body>
</html>
