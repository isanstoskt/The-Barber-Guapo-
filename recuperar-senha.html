<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Recuperar senha - Guapo The Barber</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin-body">

  <main class="login-admin-container">
    <section class="login-admin-card card-recuperar-centralizado">
      <div class="login-admin-logo logo-recuperar-centralizado">
        <h1>Guapo</h1>
        <span>The Barber</span>
      </div>

      <p class="admin-tag tag-recuperar-centralizado">Recuperar acesso</p>

      <h2 class="titulo-recuperar-centralizado">Esqueci minha senha</h2>

      <p class="login-admin-texto texto-recuperar-centralizado">
        Informe seu e-mail, confirme o código enviado e depois crie uma nova senha.
      </p>

      <!-- ETAPA 1 -->
      <form id="formSolicitarCodigo" class="login-admin-form form-recuperar-centralizado">
        <div id="etapaEmail" class="bloco-recuperacao">
          <div class="campo-recuperacao">
            <label for="email">E-mail cadastrado</label>
            <input
              type="email"
              id="email"
              placeholder="Digite seu e-mail"
              required
            />
          </div>

          <button type="submit" id="btnEnviarCodigo">Enviar código</button>
        </div>
      </form>

      <!-- ETAPA 2 -->
      <form id="formVerificarCodigo" class="login-admin-form form-recuperar-centralizado" style="display: none;">
        <div id="etapaCodigo" class="bloco-recuperacao">
          <div class="campo-recuperacao">
            <label for="codigo">Código de verificação</label>
            <input
              type="text"
              id="codigo"
              placeholder="Digite o código de 6 dígitos"
              maxlength="6"
              required
            />
          </div>

          <button type="submit" id="btnConfirmarCodigo">Confirmar código</button>
        </div>
      </form>

      <!-- ETAPA 3 -->
      <form id="formRedefinirSenha" class="login-admin-form form-recuperar-centralizado" style="display: none;">
        <div id="etapaSenha" class="bloco-recuperacao">
          <div class="campo-recuperacao">
            <label for="novaSenha">Nova senha</label>
            <input
              type="password"
              id="novaSenha"
              placeholder="Digite sua nova senha"
              required
            />
          </div>

          <div class="campo-recuperacao">
            <label for="confirmarSenha">Confirmar nova senha</label>
            <input
              type="password"
              id="confirmarSenha"
              placeholder="Digite novamente"
              required
            />
          </div>

          <button type="submit" id="btnRedefinirSenha">Redefinir senha</button>
        </div>
      </form>

      <p id="mensagemRecuperar" class="mensagem-login mensagem-recuperar-centralizada"></p>

      <div class="login-links links-recuperar-centralizado">
        <a href="login.html" class="botao-outline-dourado">
          Voltar para o login
        </a>

        <a href="index.html" class="botao-outline-dourado">
          Voltar para o site
        </a>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>

  <script>
    const formSolicitarCodigo = document.getElementById("formSolicitarCodigo");
    const formVerificarCodigo = document.getElementById("formVerificarCodigo");
    const formRedefinirSenha = document.getElementById("formRedefinirSenha");

    const mensagemRecuperar = document.getElementById("mensagemRecuperar");

    const btnEnviarCodigo = document.getElementById("btnEnviarCodigo");
    const btnConfirmarCodigo = document.getElementById("btnConfirmarCodigo");
    const btnRedefinirSenha = document.getElementById("btnRedefinirSenha");

    let emailRecuperacao = "";
    let codigoRecuperacao = "";

    function mostrarMensagem(texto, erro = false) {
      mensagemRecuperar.textContent = texto;

      if (erro) {
        mensagemRecuperar.classList.add("erro");
      } else {
        mensagemRecuperar.classList.remove("erro");
      }
    }

    formSolicitarCodigo.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim().toLowerCase();

      if (!email) {
        mostrarMensagem("Informe seu e-mail.", true);
        return;
      }

      btnEnviarCodigo.disabled = true;
      btnEnviarCodigo.textContent = "Enviando...";
      mostrarMensagem("Enviando código...");

      const retorno = await solicitarCodigoRecuperacao(email);

      btnEnviarCodigo.disabled = false;
      btnEnviarCodigo.textContent = "Enviar código";

      if (!retorno.sucesso) {
        mostrarMensagem(retorno.mensagem || "Não foi possível enviar o código.", true);
        return;
      }

      emailRecuperacao = email;
      mostrarMensagem("Código enviado com sucesso! Verifique seu e-mail.");

      formSolicitarCodigo.style.display = "none";
      formVerificarCodigo.style.display = "block";
    });

    formVerificarCodigo.addEventListener("submit", async function (event) {
      event.preventDefault();

      const codigo = document.getElementById("codigo").value.trim();

      if (!codigo) {
        mostrarMensagem("Digite o código recebido.", true);
        return;
      }

      btnConfirmarCodigo.disabled = true;
      btnConfirmarCodigo.textContent = "Confirmando...";
      mostrarMensagem("Validando código...");

      const retorno = await verificarCodigoRecuperacao(emailRecuperacao, codigo);

      btnConfirmarCodigo.disabled = false;
      btnConfirmarCodigo.textContent = "Confirmar código";

      if (!retorno.sucesso) {
        mostrarMensagem(retorno.mensagem || "Código inválido.", true);
        return;
      }

      codigoRecuperacao = codigo;
      mostrarMensagem("Código confirmado. Agora crie sua nova senha.");

      formVerificarCodigo.style.display = "none";
      formRedefinirSenha.style.display = "block";
    });

    formRedefinirSenha.addEventListener("submit", async function (event) {
      event.preventDefault();

      const novaSenha = document.getElementById("novaSenha").value.trim();
      const confirmarSenha = document.getElementById("confirmarSenha").value.trim();

      if (!novaSenha || !confirmarSenha) {
        mostrarMensagem("Preencha os campos de senha.", true);
        return;
      }

      if (novaSenha.length < 6) {
        mostrarMensagem("A senha deve ter no mínimo 6 caracteres.", true);
        return;
      }

      if (novaSenha !== confirmarSenha) {
        mostrarMensagem("As senhas não conferem.", true);
        return;
      }

      btnRedefinirSenha.disabled = true;
      btnRedefinirSenha.textContent = "Salvando...";
      mostrarMensagem("Redefinindo senha...");

      const retorno = await redefinirSenha(emailRecuperacao, codigoRecuperacao, novaSenha);

      btnRedefinirSenha.disabled = false;
      btnRedefinirSenha.textContent = "Redefinir senha";

      if (!retorno.sucesso) {
        mostrarMensagem(retorno.mensagem || "Não foi possível redefinir a senha.", true);
        return;
      }

      mostrarMensagem("Senha redefinida com sucesso! Redirecionando para o login...");

      setTimeout(function () {
        window.location.href = "login.html";
      }, 1800);
    });
  </script>

</body>
</html>
